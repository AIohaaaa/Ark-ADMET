<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="380" viewBox="0 0 1240 380" role="img" aria-labelledby="title desc">
  <title id="title">Ark-ADMET at a glance</title>
  <desc id="desc">A molecule becomes shared fingerprint blocks plus endpoint-selected optional blocks, then flows through CatBoost and an optional MiniMol head to five TDC test scores summarized as mean and standard deviation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .h { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .k { font: 700 13px Arial, sans-serif; fill: #475569; letter-spacing: 1.5px; }
      .l { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .s { font: 400 12px Arial, sans-serif; fill: #475569; }
      .w { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="380" rx="20" fill="#f8fafc"/>

  <!-- Molecule -->
  <g transform="translate(32 90)">
    <rect width="154" height="200" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="77,35 118,58 118,106 77,129 36,106 36,58" fill="none" stroke="#0284c7" stroke-width="4"/>
    <line x1="77" y1="35" x2="77" y2="8" stroke="#0284c7" stroke-width="4"/>
    <line x1="118" y1="82" x2="145" y2="82" stroke="#0284c7" stroke-width="4"/>
    <circle cx="77" cy="8" r="8" fill="#38bdf8"/>
    <circle cx="145" cy="82" r="8" fill="#7c3aed"/>
    <circle cx="36" cy="82" r="8" fill="#16a34a"/>
    <text x="77" y="164" text-anchor="middle" class="h">SMILES</text>
    <text x="77" y="184" text-anchor="middle" class="s">22 endpoints</text>
  </g>

  <path d="M186 190 H222" class="arrow"/>

  <!-- Shared blocks -->
  <g transform="translate(226 60)">
    <text x="110" y="18" text-anchor="middle" class="k">ALWAYS</text>
    <rect x="0" y="34" width="220" height="250" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="56" width="180" height="42" rx="10" fill="#0284c7"/>
    <text x="34" y="82" class="w">Morgan</text><text x="185" y="82" text-anchor="end" class="w">1024</text>
    <rect x="20" y="108" width="180" height="42" rx="10" fill="#0ea5e9"/>
    <text x="34" y="134" class="w">Avalon</text><text x="185" y="134" text-anchor="end" class="w">1024</text>
    <rect x="20" y="160" width="180" height="42" rx="10" fill="#38bdf8"/>
    <text x="34" y="186" class="w">ErG</text><text x="185" y="186" text-anchor="end" class="w">315</text>
    <rect x="20" y="212" width="180" height="42" rx="10" fill="#7dd3fc"/>
    <text x="34" y="238" class="l">RDKit</text><text x="185" y="238" text-anchor="end" class="l">200</text>
  </g>

  <path d="M446 190 H482" class="arrow"/>

  <!-- Optional plugs -->
  <g transform="translate(486 60)">
    <text x="105" y="18" text-anchor="middle" class="k">PICK PER ENDPOINT</text>
    <rect x="0" y="34" width="210" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="48" cy="82" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="48" y="87" text-anchor="middle" class="l">3D</text>
    <text x="92" y="79" class="l">PaDEL</text>
    <text x="92" y="98" class="s">17 / 22</text>
    <circle cx="48" cy="157" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="48" y="162" text-anchor="middle" class="l">GIN</text>
    <text x="92" y="154" class="l">Graph</text>
    <text x="92" y="173" class="s">9 / 22</text>
    <circle cx="48" cy="232" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="48" y="237" text-anchor="middle" class="l">M</text>
    <text x="92" y="229" class="l">MiniMol</text>
    <text x="92" y="248" class="s">5 / 22 in tree</text>
  </g>

  <path d="M696 190 H732" class="arrow"/>

  <!-- CatBoost tree -->
  <g transform="translate(736 76)">
    <rect width="178" height="184" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="89" y="28" text-anchor="middle" class="h">CatBoost</text>
    <line x1="89" y1="62" x2="52" y2="103" stroke="#7c3aed" stroke-width="3"/>
    <line x1="89" y1="62" x2="126" y2="103" stroke="#7c3aed" stroke-width="3"/>
    <line x1="52" y1="103" x2="31" y2="145" stroke="#7c3aed" stroke-width="3"/>
    <line x1="52" y1="103" x2="73" y2="145" stroke="#7c3aed" stroke-width="3"/>
    <line x1="126" y1="103" x2="105" y2="145" stroke="#7c3aed" stroke-width="3"/>
    <line x1="126" y1="103" x2="147" y2="145" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="89" cy="62" r="10" fill="#7c3aed"/>
    <circle cx="52" cy="103" r="9" fill="#a78bfa"/>
    <circle cx="126" cy="103" r="9" fill="#a78bfa"/>
    <circle cx="31" cy="145" r="8" fill="#c4b5fd"/>
    <circle cx="73" cy="145" r="8" fill="#c4b5fd"/>
    <circle cx="105" cy="145" r="8" fill="#c4b5fd"/>
    <circle cx="147" cy="145" r="8" fill="#c4b5fd"/>
  </g>

  <!-- Optional head and blend -->
  <path d="M825 260 V287" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="736" y="287" width="178" height="54" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="762" cy="314" r="7" fill="#c4b5fd"/>
  <circle cx="783" cy="304" r="7" fill="#a78bfa"/>
  <circle cx="783" cy="324" r="7" fill="#a78bfa"/>
  <circle cx="804" cy="314" r="7" fill="#7c3aed"/>
  <text x="822" y="310" class="l">MiniMol head</text>
  <text x="822" y="328" class="s">12 / 22</text>

  <path d="M914 168 H948" class="arrow"/>
  <path d="M914 314 H964 V206" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="964" cy="190" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="957" y1="190" x2="971" y2="190" stroke="#7c3aed" stroke-width="2"/>
  <line x1="964" y1="183" x2="964" y2="197" stroke="#7c3aed" stroke-width="2"/>
  <path d="M978 190 H992" class="arrow"/>

  <!-- Five runs and result -->
  <g transform="translate(994 70)">
    <rect width="214" height="240" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="107" y="34" text-anchor="middle" class="k">OFFICIAL TDC TEST</text>
    <g transform="translate(13 62)">
      <circle cx="16" cy="16" r="16" fill="#16a34a"/><text x="16" y="21" text-anchor="middle" class="w">1</text>
      <circle cx="55" cy="16" r="16" fill="#22c55e"/><text x="55" y="21" text-anchor="middle" class="w">2</text>
      <circle cx="94" cy="16" r="16" fill="#4ade80"/><text x="94" y="21" text-anchor="middle" class="w">3</text>
      <circle cx="133" cy="16" r="16" fill="#22c55e"/><text x="133" y="21" text-anchor="middle" class="w">4</text>
      <circle cx="172" cy="16" r="16" fill="#16a34a"/><text x="172" y="21" text-anchor="middle" class="w">5</text>
    </g>
    <path d="M107 110 V140" class="arrow"/>
    <rect x="31" y="145" width="152" height="62" rx="14" fill="#ffffff"/>
    <text x="107" y="183" text-anchor="middle" class="h">mean +/- std</text>
  </g>
</svg>
