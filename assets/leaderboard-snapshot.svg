<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Ark-ADMET leaderboard snapshot</title>
  <desc id="desc">A trophy marks seven first-place endpoints. A 21-dot grid shows that 12 rankable endpoints finish in the top three and nine rank fourth or lower.</desc>
  <defs>
    <style>
      .title { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .big { font: 700 54px Arial, sans-serif; fill: #0369a1; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .pill { font: 700 12px Arial, sans-serif; fill: #075985; }
    </style>
  </defs>

  <rect width="1000" height="300" rx="20" fill="#f8fafc"/>
  <text x="36" y="42" class="title">Preprint snapshot</text>

  <!-- Trophy -->
  <g transform="translate(36 70)">
    <rect width="390" height="210" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <image x="8" y="15" width="140" height="180" href="golden-trophy.png" preserveAspectRatio="xMidYMid meet"/>

    <text x="166" y="84" class="big">7</text>
    <text x="166" y="111" class="label">first-place endpoints</text>

    <rect x="166" y="132" width="87" height="32" rx="16" fill="#ffffff"/>
    <circle cx="181" cy="148" r="5" fill="#0284c7"/>
    <text x="192" y="152" class="pill">3 ahead</text>
    <rect x="262" y="132" width="84" height="32" rx="16" fill="#ffffff"/>
    <circle cx="277" cy="148" r="5" fill="#38bdf8"/>
    <text x="288" y="152" class="pill">4 tied</text>
  </g>

  <!-- 21-dot result field -->
  <g transform="translate(446 70)">
    <rect width="518" height="210" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="58" class="big">12 / 21</text>
    <text x="260" y="43" class="label">in the top 3</text>
    <text x="260" y="64" class="small">each dot is one rankable endpoint</text>

    <!-- rank 1: 7 -->
    <circle cx="43" cy="105" r="13" fill="#0284c7"/>
    <circle cx="82" cy="105" r="13" fill="#0284c7"/>
    <circle cx="121" cy="105" r="13" fill="#0284c7"/>
    <circle cx="160" cy="105" r="13" fill="#0284c7"/>
    <circle cx="199" cy="105" r="13" fill="#0284c7"/>
    <circle cx="238" cy="105" r="13" fill="#0284c7"/>
    <circle cx="277" cy="105" r="13" fill="#0284c7"/>

    <!-- rank 2-3: 5, followed by rank 4+: 2 -->
    <circle cx="43" cy="147" r="13" fill="#7c3aed"/>
    <circle cx="82" cy="147" r="13" fill="#7c3aed"/>
    <circle cx="121" cy="147" r="13" fill="#7c3aed"/>
    <circle cx="160" cy="147" r="13" fill="#7c3aed"/>
    <circle cx="199" cy="147" r="13" fill="#7c3aed"/>
    <circle cx="238" cy="147" r="13" fill="#cbd5e1"/>
    <circle cx="277" cy="147" r="13" fill="#cbd5e1"/>

    <!-- rank 4+: 7 -->
    <circle cx="43" cy="189" r="13" fill="#cbd5e1"/>
    <circle cx="82" cy="189" r="13" fill="#cbd5e1"/>
    <circle cx="121" cy="189" r="13" fill="#cbd5e1"/>
    <circle cx="160" cy="189" r="13" fill="#cbd5e1"/>
    <circle cx="199" cy="189" r="13" fill="#cbd5e1"/>
    <circle cx="238" cy="189" r="13" fill="#cbd5e1"/>
    <circle cx="277" cy="189" r="13" fill="#cbd5e1"/>

    <circle cx="350" cy="105" r="6" fill="#0284c7"/>
    <text x="365" y="110" class="small">7 rank 1</text>
    <circle cx="350" cy="147" r="6" fill="#7c3aed"/>
    <text x="365" y="152" class="small">5 rank 2-3</text>
    <circle cx="350" cy="189" r="6" fill="#cbd5e1"/>
    <text x="365" y="194" class="small">9 rank 4+</text>
  </g>
</svg>
